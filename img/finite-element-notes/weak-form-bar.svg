<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">一维杆边值问题与弱形式</title>
  <desc id="desc">左端固定、右端承受端力和杆内分布荷载的一维杆示意。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#c65a36"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8395a7" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" rx="28" fill="#fbfdff"/>
  <text x="600" y="58" text-anchor="middle" fill="#18344d" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">从强形式到弱形式：一维杆是最小但完整的样本</text>
  <rect x="95" y="165" width="34" height="205" fill="url(#hatch)" stroke="#60768c" stroke-width="2"/>
  <rect x="129" y="225" width="730" height="78" rx="8" fill="#dcecff" stroke="#4f85b1" stroke-width="3"/>
  <line x1="129" y1="264" x2="859" y2="264" stroke="#8ab7df" stroke-width="2" stroke-dasharray="8 7"/>
  <g stroke="#c65a36" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 142 V211"/>
    <path d="M390 142 V211"/>
    <path d="M530 142 V211"/>
    <path d="M670 142 V211"/>
    <path d="M810 142 V211"/>
    <path d="M864 264 H1018"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <text x="115" y="405" text-anchor="middle" fill="#40576d" font-size="21">x = 0</text>
    <text x="115" y="438" text-anchor="middle" fill="#40576d" font-size="21">u = ū</text>
    <text x="980" y="247" fill="#a94725" font-size="24" font-weight="700">t̄ = k u′(L)</text>
    <text x="980" y="280" fill="#a94725" font-size="20">自然边界条件</text>
    <text x="184" y="120" fill="#a94725" font-size="23">b(x)</text>
    <text x="540" y="338" text-anchor="middle" fill="#315d7d" font-size="22">Ω = (0, L)</text>
    <text x="250" y="468" fill="#315d7d" font-size="19">强形式：−(k u′)′ = b</text>
    <text x="650" y="468" fill="#315d7d" font-size="19">测试函数：v = 0（在位移边界）</text>
  </g>
</svg>
